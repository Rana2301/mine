<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Deep Romantic Night Sky Gradient -->
    <linearGradient id="nightSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="35%" stop-color="#1e1035" />
      <stop offset="70%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <!-- Warm Candle & Lantern Radial Light -->
    <radialGradient id="terraceWarmth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#fb7185" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Firework Glow Radial -->
    <radialGradient id="fireworkGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </radialGradient>

    <radialGradient id="fireworkRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#db2777" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.0" />
    </radialGradient>

    <!-- Boy's Tuxedo Gradient -->
    <linearGradient id="tuxedoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Girl's Sparkling Evening Gown -->
    <linearGradient id="gownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="40%" stop-color="#ff7eb3" />
      <stop offset="80%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Soft Filter -->
    <filter id="softRomanticGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deepShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Sparkle Symbol -->
    <g id="sparkleStar">
      <path d="M0,-14 Q0,0 14,0 Q0,0 0,14 Q0,0 -14,0 Q0,0 0,-14 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="3.5" fill="#fde047" />
    </g>

    <g id="heartParticle">
      <path d="M0,4 A4,4 0 0,0 8,-1 A4,4 0 0,0 0,-7 A4,4 0 0,0 -8,-1 A4,4 0 0,0 0,4 Z" fill="#ff4d6d" opacity="0.85" />
    </g>

    <g id="ringSparkle">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#fbbf24" stroke-width="2.5" />
      <!-- Diamond on Ring -->
      <polygon points="0,-12 5,-8 0,-4 -5,-8" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
      <use href="#sparkleStar" x="0" y="-8" transform="scale(0.8)" filter="url(#softRomanticGlow)" />
    </g>
  </defs>

  <!-- ========================================== -->
  <!-- 1. NIGHT SKY & CELEBRATION FIREWORKS       -->
  <!-- ========================================== -->
  <rect width="1200" height="675" fill="url(#nightSkyGrad)" />

  <!-- Fireworks Display in the Sky (Left Burst) -->
  <circle cx="220" cy="140" r="100" fill="url(#fireworkGold)" />
  <g transform="translate(220, 140)" filter="url(#softRomanticGlow)">
    <line x1="0" y1="0" x2="0" y2="-65" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="45" y2="-45" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="65" y2="0" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="45" y2="45" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="0" y2="65" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-45" y2="45" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-65" y2="0" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-45" y2="-45" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#fff" />
  </g>

  <!-- Fireworks Display in the Sky (Right Burst) -->
  <circle cx="980" cy="130" r="110" fill="url(#fireworkRose)" />
  <g transform="translate(980, 130)" filter="url(#softRomanticGlow)">
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="50" y2="-50" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="70" y2="0" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="50" y2="50" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="0" y2="70" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-50" y2="50" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-70" y2="0" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-50" y2="-50" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="7" fill="#fff" />
  </g>

  <!-- Distant City Skyline Silhouette & Glowing City Lights -->
  <polygon points="0,460 60,420 120,440 180,390 240,430 320,400 400,450 800,450 880,410 960,430 1040,380 1120,420 1200,390 1200,675 0,675" fill="#0f0728" opacity="0.9" />
  
  <!-- Glowing City Windows -->
  <circle cx="180" cy="410" r="1.5" fill="#fef08a" />
  <circle cx="240" cy="445" r="1.5" fill="#fef08a" />
  <circle cx="320" cy="420" r="1.5" fill="#fef08a" />
  <circle cx="880" cy="430" r="1.5" fill="#fef08a" />
  <circle cx="960" cy="445" r="1.5" fill="#fef08a" />
  <circle cx="1040" cy="400" r="1.5" fill="#fef08a" />

  <!-- Hanging Canopy Fairy Lights Over Terrace -->
  <path d="M0,80 Q300,160 600,100 Q900,170 1200,80" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 4" />
  <path d="M0,130 Q300,210 600,150 Q900,220 1200,130" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 3" opacity="0.8" />

  <!-- Fairy Light Bulbs Glowing -->
  <circle cx="100" cy="105" r="8" fill="#fef08a" filter="url(#softRomanticGlow)" />
  <circle cx="220" cy="138" r="8" fill="#fef08a" filter="url(#softRomanticGlow)" />
  <circle cx="340" cy="155" r="8" fill="#fef08a" filter="url(#softRomanticGlow)" />
  <circle cx="460" cy="140" r="8" fill="#fef08a" filter="url(#softRomanticGlow)" />
  <circle cx="580" cy="108" r="8" fill="#fef08a" filter="url(#softRomanticGlow)" />
  <circle cx="700" cy="125" r="8" fill="#fef08a" filter="url(#softRomanticGlow)" />
  <circle cx="820" cy="155" r="8" fill="#fef08a" filter="url(#softRomanticGlow)" />
  <circle cx="940" cy="155" r="8" fill="#fef08a" filter="url(#softRomanticGlow)" />
  <circle cx="1060" cy="120" r="8" fill="#fef08a" filter="url(#softRomanticGlow)" />

  <!-- ========================================== -->
  <!-- 2. ROMANTIC ROOFTOP TERRACE FLOOR & TABLE  -->
  <!-- ========================================== -->
  <!-- Terrace Floor -->
  <polygon points="0,480 1200,480 1200,675 0,675" fill="#1e1035" stroke="#be185d" stroke-width="3" />
  <polygon points="0,520 1200,520 1200,675 0,675" fill="#140827" />

  <!-- Warm Candlelight Center Light Beam -->
  <circle cx="600" cy="480" r="300" fill="url(#terraceWarmth)" pointer-events="none" />

  <!-- Terrace Glass Balustrade (Backdrop) -->
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#fda4af" stroke-width="4" opacity="0.6" />
  <line x1="200" y1="480" x2="200" y2="520" stroke="#fda4af" stroke-width="2" opacity="0.5" />
  <line x1="400" y1="480" x2="400" y2="520" stroke="#fda4af" stroke-width="2" opacity="0.5" />
  <line x1="800" y1="480" x2="800" y2="520" stroke="#fda4af" stroke-width="2" opacity="0.5" />
  <line x1="1000" y1="480" x2="1000" y2="520" stroke="#fda4af" stroke-width="2" opacity="0.5" />

  <!-- Candlelit Celebration Centerpiece Table -->
  <g transform="translate(480, 420)" filter="url(#deepShadow)">
    <!-- Table Surface (Circular Dining Table) -->
    <ellipse cx="120" cy="110" rx="140" ry="32" fill="#881337" stroke="#fb7185" stroke-width="3" />
    <ellipse cx="120" cy="105" rx="125" ry="26" fill="#be123c" stroke="#fecdd3" stroke-width="1.5" />

    <!-- 1 Year Milestone & 1st Birthday Cake -->
    <!-- Cake Base -->
    <path d="M70,65 Q120,80 170,65 L170,95 Q120,110 70,95 Z" fill="#fff" stroke="#f43f5e" stroke-width="2" />
    <ellipse cx="120" cy="65" rx="50" ry="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" />
    <!-- Number '1' Golden Candle for 1 Year & 1st Birthday -->
    <text x="120" y="55" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#f59e0b" text-anchor="middle" filter="url(#softRomanticGlow)">
      1
    </text>
    <!-- Candle Flame -->
    <circle cx="120" cy="24" r="5" fill="#fde047" filter="url(#softRomanticGlow)" />
    
    <!-- Rose Flower Bouquet on Table -->
    <circle cx="50" cy="95" r="10" fill="#e11d48" />
    <circle cx="62" cy="90" r="9" fill="#be123c" />
    <circle cx="42" cy="85" r="9" fill="#f43f5e" />
    <circle cx="55" cy="80" r="8" fill="#e11d48" />
    
    <!-- Crystal Toasting Flutes / Champagne Glasses 🥂 -->
    <!-- Glass 1 -->
    <polygon points="180,85 190,85 194,55 176,55" fill="#fef08a" opacity="0.8" stroke="#ffffff" stroke-width="1.5" />
    <line x1="185" y1="85" x2="185" y2="105" stroke="#ffffff" stroke-width="2" />
    <ellipse cx="185" cy="105" rx="7" ry="2" fill="#ffffff" />
    <!-- Glass 2 (Clinking Toast 🥂) -->
    <polygon points="196,82 206,82 214,53 196,53" fill="#fef08a" opacity="0.8" stroke="#ffffff" stroke-width="1.5" transform="rotate(-15, 201, 70)" />
    <line x1="201" y1="82" x2="201" y2="102" stroke="#ffffff" stroke-width="2" transform="rotate(-15, 201, 70)" />
    <ellipse cx="201" cy="102" rx="7" ry="2" fill="#ffffff" transform="rotate(-15, 201, 70)" />

    <!-- Toast Clinking Sparkle 🥂✨ -->
    <use href="#sparkleStar" x="195" y="50" transform="scale(1.2)" filter="url(#softRomanticGlow)" />
  </g>

  <!-- ========================================== -->
  <!-- 3. THE COUPLE (ROMANTICALLY IN LOVE)       -->
  <!-- ========================================== -->
  
  <!-- BOY (LEFT) - In Elegant Tuxedo / Suit -->
  <g transform="translate(250, 160)" filter="url(#deepShadow)">
    
    <!-- Boy Torso (Sharp Black Formal Tuxedo) -->
    <path d="M90,390 L120,190 Q170,160 230,170 L270,190 L300,390 Z" fill="url(#tuxedoGrad)" stroke="#334155" stroke-width="3.5" />
    
    <!-- White Crisp Shirt & Rose Gold Bowtie -->
    <polygon points="165,170 195,245 225,170" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Rose Gold Bowtie -->
    <polygon points="182,185 208,185 202,198 188,198" fill="#f43f5e" stroke="#be123c" stroke-width="1.5" />
    <circle cx="195" cy="192" r="3.5" fill="#fbbf24" />
    <!-- Red Rose Boutonniere on Lapel -->
    <circle cx="150" cy="215" r="6" fill="#e11d48" />
    <path d="M150,221 L145,232" stroke="#22c55e" stroke-width="2" />

    <!-- Boy Head & Neck -->
    <polygon points="180,160 210,160 205,190 185,190" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
    <ellipse cx="195" cy="115" rx="38" ry="44" fill="#fed7aa" stroke="#ea580c" stroke-width="3" />

    <!-- Boy Anime Hair (Sharp & Stylish) -->
    <path d="M150,115 Q145,60 180,45 Q220,35 250,60 Q265,90 255,125 Q240,85 210,90 Q180,95 160,125 Z" fill="#0f172a" stroke="#020617" stroke-width="3" />

    <!-- Boy Eyes (Gazing Lovingly at Her with Pure Devotion) -->
    <ellipse cx="195" cy="112" rx="6" ry="9" fill="#0f172a" />
    <circle cx="198" cy="108" r="2.5" fill="#ffffff" />
    <path d="M185,100 Q195,95 205,102" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

    <!-- Loving Gentle Smile -->
    <path d="M190,132 Q202,145 214,132" fill="none" stroke="#be123c" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="180" cy="126" rx="8" ry="4" fill="#fda4af" opacity="0.9" />

    <!-- Boy Right Arm Reaching Forward to Hold Her Hand -->
    <path d="M250,200 Q290,240 330,265" fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round" />
    <path d="M250,200 Q290,240 330,265" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
    <circle cx="330" cy="265" r="14" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
  </g>

  <!-- GIRL (RIGHT) - In Radiant Romantic Evening Gown -->
  <g transform="translate(620, 140)" filter="url(#deepShadow)">
    
    <!-- Girl Gown Body (Rose Pink Gown with Shimmer) -->
    <path d="M120,410 L145,210 Q195,180 250,210 L285,410 Z" fill="url(#gownGrad)" stroke="#881337" stroke-width="3.5" />
    
    <!-- Sweetheart Neckline with Sparkling Diamond Necklace 💎 -->
    <path d="M170,210 Q198,235 225,210" fill="#ffffff" stroke="#be123c" stroke-width="2" opacity="0.95" />
    <circle cx="198" cy="225" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1" filter="url(#softRomanticGlow)" />

    <!-- Girl Head & Long Elegant Hair -->
    <!-- Back Flowing Hair -->
    <path d="M130,130 Q105,220 120,340 Q195,360 265,340 Q280,220 260,130 Z" fill="#3b1d11" stroke="#1f0e08" stroke-width="3.5" />
    
    <!-- Neck & Face -->
    <polygon points="182,170 214,170 208,205 188,205" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
    <ellipse cx="198" cy="120" rx="38" ry="44" fill="#fed7aa" stroke="#ea580c" stroke-width="3" />
    
    <!-- Front Hair & Soft Bangs -->
    <path d="M155,120 Q150,65 198,55 Q245,65 240,120 Q222,88 198,94 Q172,88 155,120 Z" fill="#3b1d11" stroke="#1f0e08" stroke-width="3" />

    <!-- Royal Birthday Queen Tiara / Crown 👑 -->
    <polygon points="175,55 186,28 198,42 210,28 221,55" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <circle cx="186" cy="28" r="3" fill="#f43f5e" />
    <circle cx="198" cy="42" r="3.5" fill="#38bdf8" />
    <circle cx="210" cy="28" r="3" fill="#f43f5e" />

    <!-- Radiant Anime Eyes (Gazing Lovingly into His Eyes) -->
    <ellipse cx="184" cy="116" rx="6.5" ry="9.5" fill="#1e293b" />
    <circle cx="181" cy="112" r="2.8" fill="#ffffff" />
    <path d="M174,104 Q184,98 194,106" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Radiant Happy Soulmate Smile & Soft Blush -->
    <path d="M185,138 Q198,154 212,138" fill="#be123c" stroke="#881337" stroke-width="2.5" />
    <ellipse cx="168" cy="132" rx="9" ry="5" fill="#fda4af" opacity="0.95" />
    <ellipse cx="228" cy="132" rx="9" ry="5" fill="#fda4af" opacity="0.95" />

    <!-- Girl Left Arm Reaching Out to Interlock Hands with Him -->
    <path d="M145,220 Q105,260 70,285" fill="none" stroke="#f43f5e" stroke-width="24" stroke-linecap="round" />
    <path d="M145,220 Q105,260 70,285" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" />
    <circle cx="70" cy="285" r="13" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
  </g>

  <!-- ========================================== -->
  <!-- 4. INTERTWINED HANDS & THE PROMISE RING 💍 -->
  <!-- ========================================== -->
  <g transform="translate(600, 425)" filter="url(#softRomanticGlow)">
    <!-- Hands Interlocking in the Center -->
    <ellipse cx="-15" cy="0" rx="18" ry="14" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5" />
    <ellipse cx="15" cy="-2" rx="18" ry="14" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5" />
    
    <!-- Promise Engagement Ring on Finger 💍 -->
    <use href="#ringSparkle" x="5" y="-5" transform="scale(1.5)" filter="url(#softRomanticGlow)" />
    
    <!-- Radiant Heart of Love in Center -->
    <use href="#heartParticle" x="0" y="-35" transform="scale(2.2)" filter="url(#softRomanticGlow)" />
  </g>

  <!-- ========================================== -->
  <!-- 5. FLOATING CONFETTI, SPARKLES & EMOTIONS  -->
  <!-- ========================================== -->
  <use href="#sparkleStar" x="280" y="240" transform="scale(1.5)" filter="url(#softRomanticGlow)" />
  <use href="#sparkleStar" x="420" y="160" transform="scale(1.3)" />
  <use href="#sparkleStar" x="780" y="180" transform="scale(1.6)" filter="url(#softRomanticGlow)" />
  <use href="#sparkleStar" x="920" y="260" transform="scale(1.4)" />
  <use href="#sparkleStar" x="540" y="280" transform="scale(1.2)" />
  <use href="#sparkleStar" x="660" y="280" transform="scale(1.5)" filter="url(#softRomanticGlow)" />

  <use href="#heartParticle" x="380" y="280" transform="scale(1.4)" filter="url(#softRomanticGlow)" />
  <use href="#heartParticle" x="820" y="290" transform="scale(1.6)" filter="url(#softRomanticGlow)" />
  <use href="#heartParticle" x="600" y="180" transform="scale(2.0)" filter="url(#softRomanticGlow)" />
  <use href="#heartParticle" x="500" y="220" transform="scale(1.3)" />
  <use href="#heartParticle" x="700" y="220" transform="scale(1.3)" />

  <!-- ========================================== -->
  <!-- 6. TOP MILESTONE BANNER                    -->
  <!-- ========================================== -->
  <rect x="180" y="20" width="840" height="50" rx="16" fill="#ffffff" opacity="0.95" stroke="#f43f5e" stroke-width="2.5" filter="url(#deepShadow)" />
  <text x="600" y="45" font-family="'Georgia', 'Playfair Display', serif" font-size="15" font-weight="bold" fill="#be123c" text-anchor="middle" letter-spacing="1">
    💍 AUGUST 26, 2026 • OUR 1ST BIRTHDAY TOGETHER AS LOVERS 🥂
  </text>
  <text x="600" y="62" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#db2777" text-anchor="middle" letter-spacing="0.5">
    365+ Days of Magic • 1 Year Anniversary Milestone • Soulmates Forever ❤️
  </text>
</svg>
